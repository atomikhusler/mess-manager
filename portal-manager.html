<!-- portal-manager.html -->
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mess Manager - Portal</title>
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { telegram: '#3390ec' },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="core/bughunter.js"></script> 
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        html, body { 
            background-color: #000000 !important; 
            color: #ffffff; 
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent; 
            overscroll-behavior-y: none; 
        }
        .hardware-accelerated { transform: translateZ(0); will-change: transform, opacity; }
        .active-scale { transition: transform 0.15s cubic-bezier(0.25, 1, 0.5, 1); }
        .active-scale:active { transform: scale(0.95); }
        .disable-scrollbars::-webkit-scrollbar { display: none; }
        .fade-in { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body id="app-body" class="hardware-accelerated h-[100dvh] w-screen flex flex-col overflow-hidden opacity-0 transition-opacity duration-300 bg-black selection:bg-telegram/20">

    <!-- Global Top Bar: Hamburger anchored left, Pulse anchored right -->
    <header class="fixed top-0 inset-x-0 pt-[env(safe-area-inset-top)] bg-[#09090b]/80 backdrop-blur-2xl border-b border-white/[0.08] z-30">
        <div class="px-5 py-3.5 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <button id="btn-menu" class="w-9 h-9 rounded-full flex items-center justify-center active-scale bg-white/5 border border-white/10 text-white hover:bg-white/10 relative overflow-hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
                </button>
                <div>
                    <h1 class="text-[15px] font-black tracking-tight leading-none text-white">Mess Manager</h1>
                    <div id="header-page-title" class="text-[10px] font-bold uppercase tracking-widest mt-1 text-telegram">Daily Execution</div>
                </div>
            </div>
            <div class="flex items-center gap-2.5">
                <button id="btn-calc-header" class="w-9 h-9 rounded-full flex items-center justify-center active-scale bg-white/5 border border-white/10 text-white hover:bg-white/10">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>
                </button>
                <button id="btn-notify" class="w-9 h-9 rounded-full flex items-center justify-center active-scale bg-white/5 border border-white/10 text-white hover:bg-white/10 relative">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
                </button>
                <button id="btn-pulse" class="w-9 h-9 rounded-[10px] flex items-center justify-center active-scale bg-telegram/10 border border-telegram/20 text-telegram shadow-inner hover:bg-telegram/20 relative overflow-hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main id="main-content" class="flex-1 overflow-y-auto px-4 mt-[calc(60px+env(safe-area-inset-top))] mb-[calc(60px+env(safe-area-inset-bottom))] hardware-accelerated relative disable-scrollbars pb-6">
        <!-- Dynamic Tab Views Injected Here -->
    </main>

    <!-- Bottom Navigation Bar: Strict Routing Order -->
    <nav class="fixed bottom-0 inset-x-0 pb-[env(safe-area-inset-bottom)] bg-[#09090b]/90 backdrop-blur-2xl border-t border-white/[0.08] z-30 flex justify-between px-6 py-2">
        <button class="nav-btn flex flex-col items-center gap-1 p-2 active-scale transition-colors text-telegram" data-target="view-roster">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="m9 16 2 2 4-4"/></svg>
            <span class="text-[9px] font-black uppercase tracking-wider">Roster</span>
        </button>
        <button class="nav-btn flex flex-col items-center gap-1 p-2 active-scale transition-colors text-white/30" data-target="view-directory">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span class="text-[9px] font-black uppercase tracking-wider">Members</span>
        </button>
        <button class="nav-btn flex flex-col items-center gap-1 p-2 active-scale transition-colors text-white/30" data-target="view-ledger">
            <!-- Universal Wallet Icon -->
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5H5a2 2 0 0 1 0-4h16V12z"/></svg>
            <span class="text-[9px] font-black uppercase tracking-wider">Ledger</span>
        </button>
        <button class="nav-btn flex flex-col items-center gap-1 p-2 active-scale transition-colors text-white/30" data-target="view-stats">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
            <span class="text-[9px] font-black uppercase tracking-wider">Analytics</span>
        </button>
    </nav>

    <!-- Z-Index Enforced Structural Mounts -->
    <div id="drawer-container" class="relative z-[100]"></div>
    <div id="modal-container" class="relative z-[105]"></div>
    
    <!-- Locked Toast Architecture: z-[110] forces toasts cleanly over the frosted glass of open drawers -->
    <div id="toast-container" class="fixed top-[calc(1.5rem+env(safe-area-inset-top,0px))] inset-x-0 px-4 z-[110] flex flex-col gap-2 pointer-events-none"></div>

    <script type="module" src="manager/manager-app.js"></script>
</body>
</html>
